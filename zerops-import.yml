# Doorbell — deploy your own tunnel network
#
# THIS FILE IS THE PRODUCT.
# Paste it into https://app.zerops.io -> "Import a project using YAML template".
# About 90 seconds later you own a private ngrok: gateway, database, cache,
# all wired together on a private VXLAN network.
#
# ngrok is a SaaS you rent. This is a network you own.
#
# ┌─ ONE MANUAL STEP AFTERWARDS ────────────────────────────────────────────┐
# │ The raw TCP control port cannot be opened from this file — the import   │
# │ schema has no field for public port routing. After the import finishes: │
# │                                                                          │
# │   gw service -> Public access -> add port routing                       │
# │     public 7000 -> internal 7000, protocol tcp                          │
# │                                                                          │
# │ Pick IPv6 (free) or a dedicated IPv4 ($3/30d). A SHARED IPv4 cannot      │
# │ carry raw ports — the API rejects it with publicIpTypeNotSupported.      │
# │ Verified, not guessed.                                                   │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Service type strings are verified against the live Zerops import schema
# (202-value enum, checked 8 Aug 2026).

project:
  name: doorbell
  location: eu-central        # eu-central (prg1) | us-east-1 (ny1) | us-west-1 (sea1)
  corePackage: LIGHT          # free; SERIOUS is $10/30d, upgradeable but NEVER downgradeable
  tags:
    - doorbell

services:
  # ── Postgres: reserved names, request history, and the webhook mailbox.
  # priority is descending — higher is created FIRST. The gateway needs these
  # to exist before it boots, so db/cache are 100 and gw is 10.
  - hostname: db
    type: postgresql:single@17
    priority: 100

  # ── Valkey: the live routing table.
  # A tunnel is pinned to whichever gateway container holds its TCP socket, but
  # the ingress load-balances across all of them. This is what lets a container
  # that does not hold a tunnel forward to the one that does. Without it,
  # scaling past one container silently breaks tunnels.
  - hostname: cache
    type: valkey:single@7.2
    priority: 100

  # ── The gateway: raw TCP control port + HTTP ingress + embedded dashboard.
  # This is the service that could not exist on Vercel/Netlify/Workers — it has
  # to hold a long-lived TCP socket open, which is structurally impossible on a
  # platform that terminates HTTP and sleeps between requests. Zerops' lack of
  # scale-to-zero is the enabling feature here, not a cost.
  - hostname: gw
    type: ubuntu/go@1
    priority: 10
    minContainers: 1
    maxContainers: 3
    enableSubdomainAccess: true   # free https://*.zerops.app + managed SSL
    buildFromGit: https://github.com/BigAchiever/Doorbell
    envSecrets:
      # zeroconfig = path routing on the free Zerops subdomain, no DNS needed.
      # wildcard   = abc.your-domain.com, needs DNS + a wildcard certificate.
      DOORBELL_MODE: zeroconfig
      DOORBELL_BASE_DOMAIN: ""
      # Gates the dashboard, the operator API and replay — everything that can
      # read a captured body. Generated per import, so no two deployments share
      # a secret and nobody inherits one from the README.
      DOORBELL_ADMIN_TOKEN: <@generateRandomString(<32>)>
      # Gates the control port instead: who may open a tunnel at all. Left empty
      # on purpose. Anyone can tunnel through this gateway, nobody but you can
      # see what went through it. Set it to lock the gateway to your own team —
      # but never to the same value as the token above, or every tunnel user
      # gets your inspector.
      DOORBELL_CLIENT_TOKEN: ""
      # Set this to your gateway's public origin after the first deploy, so the
      # CLI prints a URL people can actually open:
      #   https://gw-<subdomainHost>-3000.<region>.zerops.app
      DOORBELL_PUBLIC_BASE: ""
      # Where clients dial the raw TCP control port. It is NOT the subdomain
      # above: that name resolves to the shared HTTP balancer, which will refuse
      # port 7000. Use the project's own public IP, shown in Zerops once the
      # port routing from the header block exists. IPv6 goes in bare, no
      # brackets — the CLI adds them.
      DOORBELL_CONTROL_HOST: ""
