# Doorbell — build / deploy / run
#
# Ports live HERE, not in the import YAML. The import schema has no `ports`
# field at all (verified against the live schema) — it belongs to run.ports.
#
# THE LOAD-BEARING LINE IN THIS FILE is port 7000 with protocol TCP and
# httpSupport false. That is the raw TCP control port every doorbell client
# holds open. Vercel, Netlify, Cloudflare Workers and Lambda cannot express
# this line at all; they terminate HTTP and nothing else.

zerops:
  - setup: gw
    build:
      base: go@1
      buildCommands:
        - go mod download
        - go build -o doorbell-gw ./cmd/gateway
      deployFiles:
        - doorbell-gw
      cache:
        - /root/go/pkg/mod

    deploy:
      # false = zero-downtime. New containers boot and pass readiness before old
      # ones stop. Matters more than usual here: a restart drops every live
      # tunnel, so avoid churn during judging.
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3000
          path: /healthz

    run:
      base: go@1
      ports:
        # HTTP ingress. Gets the free https://*.zerops.app subdomain and the
        # managed cert. This is what serves zeroconfig mode: /t/<id>/...
        - port: 3000
          protocol: tcp
          httpSupport: true

        # THE CONTROL PORT. Raw TCP, no HTTP. Each `doorbell 3000` client dials
        # this once and keeps the socket open; requests are multiplexed back
        # down it. Allowed range is 10-65435 (80 and 443 are reserved).
        # NOTE: ports 25 and 465 are permanently blocked by Zerops — verified in
        # their SMTP docs, "no exceptions". 7000 is well clear of that.
        - port: 7000
          protocol: tcp
          httpSupport: false

      # Nightly retention pass. Enqueue already trims a busy tunnel back to its
      # cap, but a tunnel used once and abandoned keeps its delivered rows for
      # ever — bodies included. This is the job that reclaims them.
      #
      # allContainers is false on purpose: with maxContainers 3 this would
      # otherwise run three times against one shared database.
      crontab:
        - command: 'wget -qO- --post-data="" --header="Authorization: Bearer $DOORBELL_ADMIN_TOKEN" http://localhost:3000/internal/sweep'
          timing: "20 3 * * *"
          allContainers: false
          workingDir: /var/www

      envVariables:
        PORT: "3000"
        CONTROL_PORT: "7000"
        # Cross-service references resolve over the project's private VXLAN by
        # bare hostname. Never use https:// between services in a project.
        #
        # Both values below are taken from what the services actually publish,
        # not from the docs. Two details bite if you guess:
        #   - Postgres' connectionString has NO database name on the end, so
        #     dbName has to be appended by hand.
        #   - Valkey's hostname carries a .zerops suffix inside its own string.
        DATABASE_URL: ${db_connectionString}/${db_dbName}
        REDIS_URL: ${cache_connectionString}

      start: ./doorbell-gw

  # ── demo: a permanently-connected tunnel, so the delivery path is visible
  # without installing anything.
  #
  # Two curl commands against the gateway already prove a request gets held
  # (202) and that an unknown tunnel is refused (404). Neither can show a
  # request arriving somewhere, because that needs a client on the far side.
  # This is that client — and it is the ordinary one: the same ./cmd/doorbell
  # the README tells you to `go install`, run against a local server, with no
  # special case anywhere in the gateway.
  #
  # It also quietly demonstrates the pillar this whole project rests on. This
  # container has held one outbound TCP socket open to gw since it booted. On a
  # platform that sleeps between requests there is nothing to hold it.
  - setup: demo
    build:
      base: go@1
      buildCommands:
        - go mod download
        - go build -o demotarget ./cmd/demotarget
        - go build -o doorbell ./cmd/doorbell
      deployFiles:
        - demotarget
        - doorbell
      cache:
        - /root/go/pkg/mod

    deploy:
      readinessCheck:
        httpGet:
          port: 8080
          path: /healthz

    run:
      base: go@1
      ports:
        # No httpSupport and no public routing: this port is reachable over the
        # project's private network and through the tunnel, and nowhere else.
        # Visitors arrive via the gateway, which is the entire point.
        - port: 8080
          protocol: tcp
          httpSupport: false

      envVariables:
        DEMO_PORT: "8080"
        # A sibling service on the same VXLAN, so this is a bare hostname over
        # the private network — no public IP, no TLS, no DNS. The CLI reads
        # DOORBELL_GATEWAY on its own, which is why the start line below passes
        # no -gateway flag.
        DOORBELL_GATEWAY: gw
        DOORBELL_CONTROL_PORT: "7000"

      # The echo server runs in the background; the loop keeps the tunnel up
      # across gateway restarts and deploys, which is what makes this reliable
      # enough to point strangers at. `kill -0` is the supervision: if the echo
      # server ever dies the loop ends, sh exits, and Zerops restarts the
      # container rather than leaving a tunnel connected to nothing.
      #
      # Flags come before the port. Go's flag package stops parsing at the first
      # positional argument, so `doorbell 8080 -name demo` would silently ignore
      # the name.
      start: sh -c './demotarget & dt=$!; while kill -0 $dt 2>/dev/null; do ./doorbell -name demo 8080; sleep 3; done'

# The dashboard and the landing page are not services. They are go:embed'd into
# the gateway binary, so they ship with it and cannot drift out of sync with the
# API they read — no static host to keep alive alongside it.
