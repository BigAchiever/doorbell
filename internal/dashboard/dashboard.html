<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)">
<meta name="description" content="Live request inspector for your Doorbell tunnels.">
<title>Dashboard · Doorbell</title>
<link rel="stylesheet" href="/assets/ds.css">
<style>
  /* Page-specific layout only. Anything reusable lives in ds.css. */
  .layout {
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    height: calc(100dvh - var(--header-h));
  }
  .side {
    border-right: 1px solid var(--line);
    background: var(--bg-raised);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: var(--s-4);
    padding-left: max(var(--s-4), env(safe-area-inset-left));
  }
  .side h2 {
    margin: 0 0 var(--s-3);
    font: 600 var(--fs-xs)/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-subtle);
  }
  .side section + section { margin-top: var(--s-8); }
  .side .hint { font-size: var(--fs-sm); color: var(--text-subtle); margin: calc(var(--s-1) * -1) 0 var(--s-3); }

  .feed { overflow-y: auto; overscroll-behavior: contain; }

  .tunnel { padding: var(--s-3); border: 1px solid var(--line); border-radius: var(--r-md); }
  .tunnel + .tunnel { margin-top: var(--s-2); }
  .tunnel__url { display: block; font: var(--fs-sm)/1.5 var(--mono); color: var(--accent); overflow-wrap: anywhere; }
  .tunnel__meta { margin-top: var(--s-1); font-size: var(--fs-sm); color: var(--text-subtle); }

  .mail { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3);
          border: 1px solid var(--line); border-radius: var(--r-md); }
  .mail + .mail { margin-top: var(--s-2); }
  .mail__what { font: 600 var(--fs-sm)/1.4 var(--mono); }
  .mail__meta { font-size: var(--fs-xs); color: var(--text-subtle); }

  /* Below the sidebar breakpoint the two panes stack and each scrolls the page
     rather than itself — nested scroll areas on a phone are miserable. */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    .feed { overflow: visible; }
    table.data th { position: static; }
    /* The tunnel column is the first thing worth losing on a narrow screen. */
    table.data .col-tunnel { display: none; }
  }
</style>

<a class="skip-link" href="#main">Skip to Content</a>

<header class="app-header">
  <h1 class="brand">Doorbell <span class="mode" id="mode" translate="no">…</span></h1>
  <nav class="nav" aria-label="Primary">
    <a href="/">Overview</a>
    <a href="/dashboard" aria-current="page">Dashboard</a>
  </nav>
  <div class="spacer"></div>
  <p class="row" style="font: var(--fs-sm)/1 var(--mono); color: var(--text-muted);">
    <span class="dot" id="dot" aria-hidden="true"></span>
    <span class="conn-label" id="conn" role="status" aria-live="polite">Connecting…</span>
    <span class="sr-only" id="connSr" role="status" aria-live="polite">Connecting…</span>
  </p>
</header>

<div class="layout">
  <aside class="side" aria-label="Tunnels and mailbox">
    <section aria-labelledby="h-tunnels">
      <h2 id="h-tunnels">Live Tunnels</h2>
      <div id="tunnels" aria-live="polite">
        <div class="skeleton" style="height:66px" aria-hidden="true"></div>
      </div>
    </section>

    <section aria-labelledby="h-mailbox">
      <h2 id="h-mailbox">Mailbox</h2>
      <p class="hint">Requests that arrived while a tunnel was offline are held here
        instead of being dropped. Replay re-sends any of them.</p>
      <div id="mailbox" aria-live="polite">
        <div class="skeleton" style="height:44px" aria-hidden="true"></div>
      </div>
    </section>
  </aside>

  <main class="feed" id="main">
    <div class="table-wrap">
      <table class="data">
        <caption class="sr-only">Requests proxied through your tunnels, newest first</caption>
        <thead>
          <tr>
            <th scope="col" style="width:80px">Method</th>
            <th scope="col">Path</th>
            <th scope="col" class="num" style="width:74px">Status</th>
            <th scope="col" class="num" style="width:84px">Time</th>
            <th scope="col" class="col-tunnel" style="width:110px">Tunnel</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="feedState"></div>
  </main>
</div>

<dialog class="sheet" id="detail" aria-labelledby="detailTitle">
  <div class="sheet__head">
    <h2 class="sheet__title grow truncate" id="detailTitle"></h2>
    <button type="button" class="btn btn--icon btn--ghost" id="detailClose" aria-label="Close details">
      <span aria-hidden="true">✕</span>
    </button>
  </div>
  <div class="sheet__body" id="detailBody"></div>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module">
import { esc, num, ms, dateTime, bytes, statusClass, toast, getJSON, postJSON, renderState }
  from '/assets/app.js';

const rowsEl   = document.getElementById('rows');
const feedState= document.getElementById('feedState');
const dialog   = document.getElementById('detail');
const seen     = new Map();

const MAX_ROWS = 250; // the DOM is bounded for the same reason the server ring buffer is

/* ── request feed ────────────────────────────────────────────────────────── */

function showFeedState(kind) {
  if (kind === 'empty') {
    feedState.innerHTML = `
      <div class="state">
        <p class="state__title">No Requests Yet</p>
        <p class="state__hint">Run <code translate="no">doorbell 3000</code>, then open your tunnel
           URL. Requests appear here the moment they arrive.</p>
      </div>`;
  } else {
    feedState.innerHTML = '';
  }
}

function addRow(rec, isNew) {
  if (seen.has(rec.id)) return;
  seen.set(rec.id, rec);
  showFeedState(null);

  const path = rec.path + (rec.query ? `?${rec.query}` : '');
  const tr = document.createElement('tr');
  tr.tabIndex = 0;
  tr.setAttribute('role', 'button');
  tr.setAttribute('aria-label',
    `${rec.method} ${path}, status ${rec.status || 'unknown'}, ${ms(rec.durMs)}. Show details.`);
  if (isNew) tr.classList.add('is-new');

  tr.innerHTML =
    `<td><span class="verb verb--${esc(rec.method)}">${esc(rec.method)}</span></td>` +
    `<td class="break">${esc(path)}</td>` +
    `<td class="num ${statusClass(rec.status)}">${rec.status || '—'}</td>` +
    `<td class="num muted"><time datetime="${esc(rec.at)}" title="${esc(dateTime(rec.at))}">${ms(rec.durMs)}</time></td>` +
    `<td class="subtle col-tunnel truncate">${esc(rec.tunnelId)}</td>`;

  const open = () => showDetail(rec);
  tr.addEventListener('click', open);
  tr.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });

  rowsEl.prepend(tr);
  while (rowsEl.children.length > MAX_ROWS) rowsEl.lastElementChild.remove();
}

/* ── detail sheet ────────────────────────────────────────────────────────── */

function kvList(obj) {
  const keys = Object.keys(obj || {});
  if (!keys.length) return '<p class="subtle" style="font-size:var(--fs-sm)">None</p>';
  return `<dl class="kv">${keys.sort().map((k) =>
    `<div><dt>${esc(k)}</dt><dd>${esc(obj[k])}</dd></div>`).join('')}</dl>`;
}

function bodyBlock(text, wasCut) {
  if (!text) return '<p class="subtle" style="font-size:var(--fs-sm)">Empty</p>';
  let pretty = text;
  try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch { /* not JSON, show raw */ }
  return `<pre class="code" translate="no">${esc(pretty)}</pre>` +
    (wasCut ? `<p class="badge badge--warn">Truncated — first ${bytes(32 * 1024)} only</p>` : '');
}

let lastFocused = null;

function showDetail(rec) {
  lastFocused = document.activeElement;
  document.getElementById('detailTitle').textContent =
    `${rec.method} ${rec.path} → ${rec.status} · ${ms(rec.durMs)}`;
  document.getElementById('detailBody').innerHTML =
    (rec.error ? `<h3 class="sr-only">Error</h3><pre class="code">${esc(rec.error)}</pre>` : '') +
    `<h3 class="subtle" style="font:600 var(--fs-xs)/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;margin:0 0 var(--s-2)">Request Headers</h3>${kvList(rec.reqHead)}` +
    `<h3 class="subtle" style="font:600 var(--fs-xs)/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;margin:var(--s-5) 0 var(--s-2)">Request Body</h3>${bodyBlock(rec.reqBody, rec.reqCut)}` +
    `<h3 class="subtle" style="font:600 var(--fs-xs)/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;margin:var(--s-5) 0 var(--s-2)">Response Headers</h3>${kvList(rec.resHead)}` +
    `<h3 class="subtle" style="font:600 var(--fs-xs)/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;margin:var(--s-5) 0 var(--s-2)">Response Body</h3>${bodyBlock(rec.resBody, rec.resCut)}`;
  dialog.showModal();
}

document.getElementById('detailClose').addEventListener('click', () => dialog.close());
// Restore focus to whatever opened the sheet, however it was dismissed (button,
// Escape, or backdrop) — otherwise keyboard focus lands back at the document top.
dialog.addEventListener('close', () => lastFocused?.focus?.());

/* ── sidebar ─────────────────────────────────────────────────────────────── */

async function loadTunnels() {
  const el = document.getElementById('tunnels');
  try {
    const list = await getJSON('/api/tunnels');
    if (!list.length) {
      renderState(el, { title: 'No tunnels open', hint: 'Start one with doorbell 3000.' });
      return;
    }
    el.innerHTML = list.map((t) => `
      <article class="tunnel">
        <a class="tunnel__url" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.url)}</a>
        <p class="tunnel__meta tnum">→ localhost:${t.localPort} · ${num(t.requests)} requests</p>
      </article>`).join('');
  } catch (err) {
    renderState(el, { title: 'Could not load tunnels', hint: err.message, tone: 'error' });
  }
}

async function loadMailbox() {
  const el = document.getElementById('mailbox');
  try {
    const [tunnels, held] = await Promise.all([
      getJSON('/api/tunnels'),
      getJSON('/api/mailbox'),
    ]);
    const names = new Set([...tunnels.map((t) => t.id), ...Object.keys(held || {})]);
    if (!names.size) {
      renderState(el, { title: 'Nothing stored', hint: 'Held and replayable requests show up here.' });
      return;
    }

    const groups = await Promise.all([...names].map(async (n) => {
      try { return [n, await getJSON(`/api/mailbox?tunnel=${encodeURIComponent(n)}`)]; }
      catch { return [n, []]; }
    }));
    const items = groups.flatMap(([n, list]) => (list || []).map((p) => ({ ...p, tunnel: n })));

    if (!items.length) {
      renderState(el, { title: 'Nothing stored', hint: 'Held and replayable requests show up here.' });
      return;
    }

    el.innerHTML = items.slice(0, 12).map((p) => {
      const sent = Boolean(p.deliveredAt);
      const what = `${p.method} ${p.path}`;
      return `
        <div class="mail">
          <span class="badge ${sent ? 'badge--ok' : 'badge--warn'}">${sent ? 'Sent' : 'Held'}</span>
          <span class="grow">
            <span class="mail__what truncate" style="display:block" title="${esc(what)}">${esc(what)}</span>
            <span class="mail__meta tnum">${esc(p.tunnel)} · ${bytes(p.bodySize)}</span>
          </span>
          <button type="button" class="btn btn--sm" data-replay="${p.id}"
                  aria-label="Replay ${esc(what)} on tunnel ${esc(p.tunnel)}">Replay</button>
        </div>`;
    }).join('');
  } catch (err) {
    renderState(el, { title: 'Could not load the mailbox', hint: err.message, tone: 'error' });
  }
}

// Delegated so buttons rendered on every refresh keep working.
document.getElementById('mailbox').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-replay]');
  if (!btn) return;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Replaying…';
  try {
    const res = await postJSON(`/api/replay/${btn.dataset.replay}`);
    toast(`Replayed — the app answered ${res?.status ?? 'OK'}.`, 'ok');
    loadMailbox();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
});

/* ── live stream ─────────────────────────────────────────────────────────── */

function connect() {
  const dot = document.getElementById('dot');
  const conn = document.getElementById('conn');
  const es = new EventSource('/api/stream');

  const connSr = document.getElementById('connSr');
  // The visible label is hidden on narrow screens, so the status has to be
  // announced from a copy that is always in the accessibility tree.
  const setStatus = (text) => { conn.textContent = text; connSr.textContent = text; };

  es.addEventListener('open', () => {
    dot.className = 'dot dot--live';
    setStatus('Live');
  });
  es.addEventListener('error', () => {
    dot.className = 'dot dot--down';
    setStatus('Reconnecting…');
  });
  es.addEventListener('hello', (e) => {
    const data = JSON.parse(e.data);
    document.getElementById('mode').textContent = `· ${data.mode}`;
    const recent = data.recent || [];
    if (!recent.length) showFeedState('empty');
    [...recent].reverse().forEach((r) => addRow(r, false));
  });
  es.addEventListener('request', (e) => {
    addRow(JSON.parse(e.data), true);
    refresh();
  });
}

function refresh() { loadTunnels(); loadMailbox(); }

connect();
refresh();
setInterval(refresh, 5000);
</script>
