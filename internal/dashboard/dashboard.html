<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doorbell</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12161b; --line:#1e252d; --ink:#e6edf3;
    --dim:#7d8792; --accent:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f7f8fa;--panel:#fff;--line:#e3e7ec;--ink:#11161c;--dim:#68727e}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  h1{font-size:15px;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--dim);font-weight:400}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;
        font:12px/1 var(--mono);color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--bad)}
  .dot.on{background:var(--accent);box-shadow:0 0 0 0 rgba(74,222,128,.6);
          animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}
                   100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
  main{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 53px)}
  @media (max-width:820px){main{grid-template-columns:1fr;height:auto}}
  aside{border-right:1px solid var(--line);background:var(--panel);
        overflow-y:auto;padding:14px}
  .lbl{font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;
       color:var(--dim);margin:0 0 10px}
  .tun{padding:10px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px}
  .tun b{font:13px/1.4 var(--mono);color:var(--accent);word-break:break-all}
  .tun small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
  .empty{color:var(--dim);font-size:13px;padding:8px 0}
  .hint{color:var(--dim);font-size:11.5px;line-height:1.45;margin:-4px 0 10px}
  .mail{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);
        border-radius:7px;margin-bottom:6px;font:12px/1.3 var(--mono)}
  .mail .who{flex:1;min-width:0}
  .mail .who b{display:block;color:var(--ink);font-weight:600;
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mail .who small{color:var(--dim)}
  .badge{font:10px/1 var(--mono);padding:3px 6px;border-radius:4px;
         text-transform:uppercase;letter-spacing:.06em}
  .badge.held{background:rgba(251,191,36,.16);color:var(--warn)}
  .badge.done{background:rgba(74,222,128,.14);color:var(--accent)}
  .rp{background:none;border:1px solid var(--line);color:var(--dim);border-radius:5px;
      padding:4px 8px;cursor:pointer;font:11px/1 var(--mono)}
  .rp:hover{color:var(--ink);border-color:var(--dim)}
  .rp:disabled{opacity:.5;cursor:default}
  .empty code{font-family:var(--mono);color:var(--ink)}
  section{overflow-y:auto;padding:0}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:var(--bg);text-align:left;
     font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;
     color:var(--dim);padding:11px 14px;border-bottom:1px solid var(--line)}
  td{padding:9px 14px;border-bottom:1px solid var(--line);font:13px/1.4 var(--mono)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--panel)}
  tbody tr.new{animation:flash 1.1s ease-out}
  @keyframes flash{from{background:rgba(74,222,128,.16)}to{background:transparent}}
  .m{font-weight:600}
  .m.GET{color:var(--accent)} .m.POST{color:var(--warn)}
  .m.PUT,.m.PATCH{color:#60a5fa} .m.DELETE{color:var(--bad)}
  .s2{color:var(--accent)} .s3{color:#60a5fa}
  .s4{color:var(--warn)} .s5{color:var(--bad)}
  .path{color:var(--ink);word-break:break-all}
  .nothing{padding:56px 20px;text-align:center;color:var(--dim)}
  .nothing p{margin:6px 0}
  .nothing code{font-family:var(--mono);color:var(--ink);background:var(--panel);
                padding:2px 6px;border-radius:4px}
  dialog{border:1px solid var(--line);border-radius:11px;background:var(--panel);
         color:var(--ink);max-width:760px;width:92vw;padding:0}
  dialog::backdrop{background:rgba(0,0,0,.62)}
  .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;
      border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px}
  .dh button{margin-left:auto;background:none;border:1px solid var(--line);
             color:var(--dim);border-radius:6px;padding:4px 10px;cursor:pointer;
             font-size:12px}
  .db{padding:18px;max-height:66vh;overflow-y:auto}
  .db h3{font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;
         color:var(--dim);margin:18px 0 8px}
  .db h3:first-child{margin-top:0}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:7px;
      padding:11px;overflow-x:auto;font:12px/1.6 var(--mono);margin:0;
      white-space:pre-wrap;word-break:break-word}
  .kv{font:12px/1.7 var(--mono)}
  .kv div{display:flex;gap:10px;border-bottom:1px solid var(--line);padding:3px 0}
  .kv span:first-child{color:var(--dim);min-width:170px;flex-shrink:0}
  .kv span:last-child{word-break:break-all}
  .cut{color:var(--warn);font-size:11px;margin-top:6px;font-family:var(--mono)}
</style>

<header>
  <h1>Doorbell <span id="mode">·</span></h1>
  <div class="live"><span class="dot" id="dot"></span><span id="status">connecting</span></div>
</header>

<main>
  <aside>
    <p class="lbl">Live tunnels</p>
    <div id="tunnels"><p class="empty">none open</p></div>

    <p class="lbl" style="margin-top:22px">Mailbox</p>
    <p class="hint">Requests that arrived while a tunnel was offline are held
      here instead of being dropped. Replay re-sends any of them.</p>
    <div id="mailbox"><p class="empty">nothing stored</p></div>
  </aside>

  <section>
    <table>
      <thead><tr><th style="width:64px">Method</th><th>Path</th>
        <th style="width:66px">Status</th><th style="width:74px">Time</th>
        <th style="width:96px">Tunnel</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="nothing" id="nothing">
      <p>No requests yet.</p>
      <p><code>doorbell 3000</code> then hit your tunnel URL.</p>
    </div>
  </section>
</main>

<dialog id="dlg">
  <div class="dh"><span id="dTitle"></span>
    <button onclick="document.getElementById('dlg').close()">close</button></div>
  <div class="db" id="dBody"></div>
</dialog>

<script>
const rows = document.getElementById('rows');
const nothing = document.getElementById('nothing');
const seen = new Map();

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function statusClass(s){ return s >= 500 ? 's5' : s >= 400 ? 's4' : s >= 300 ? 's3' : 's2'; }

function addRow(r, isNew){
  if (seen.has(r.id)) return;
  seen.set(r.id, r);
  nothing.style.display = 'none';

  const tr = document.createElement('tr');
  if (isNew) tr.className = 'new';
  tr.innerHTML =
    `<td><span class="m ${esc(r.method)}">${esc(r.method)}</span></td>` +
    `<td class="path">${esc(r.path)}${r.query ? esc('?' + r.query) : ''}</td>` +
    `<td class="${statusClass(r.status)}">${r.status || '—'}</td>` +
    `<td>${r.durMs}ms</td>` +
    `<td style="color:var(--dim)">${esc(r.tunnelId)}</td>`;
  tr.onclick = () => showDetail(r);
  rows.prepend(tr);

  // Keep the DOM bounded for the same reason the server ring buffer is: a
  // dashboard left open all weekend should not accumulate thousands of nodes.
  while (rows.children.length > 250) rows.lastChild.remove();
}

function kv(obj){
  const keys = Object.keys(obj || {});
  if (!keys.length) return '<p style="color:var(--dim);font-size:12px">none</p>';
  return '<div class="kv">' + keys.sort().map(k =>
    `<div><span>${esc(k)}</span><span>${esc(obj[k])}</span></div>`).join('') + '</div>';
}

function body(text, cut){
  if (!text) return '<p style="color:var(--dim);font-size:12px">empty</p>';
  let out = text;
  try { out = JSON.stringify(JSON.parse(text), null, 2); } catch {}
  return `<pre>${esc(out)}</pre>` +
    (cut ? '<p class="cut">truncated — only the first 32 KiB is captured</p>' : '');
}

function showDetail(r){
  document.getElementById('dTitle').textContent =
    `${r.method} ${r.path} → ${r.status} · ${r.durMs}ms`;
  document.getElementById('dBody').innerHTML =
    (r.error ? `<h3>Error</h3><pre>${esc(r.error)}</pre>` : '') +
    '<h3>Request headers</h3>' + kv(r.reqHead) +
    '<h3>Request body</h3>'    + body(r.reqBody, r.reqCut) +
    '<h3>Response headers</h3>'+ kv(r.resHead) +
    '<h3>Response body</h3>'   + body(r.resBody, r.resCut);
  document.getElementById('dlg').showModal();
}

async function loadMailbox(){
  const el = document.getElementById('mailbox');
  try {
    const tunnels = await (await fetch('api/tunnels')).json();
    const names = new Set(tunnels.map(t => t.id));
    // Also surface tunnels that are offline but still holding requests.
    const held = await (await fetch('api/mailbox')).json();
    Object.keys(held || {}).forEach(n => names.add(n));

    const groups = await Promise.all([...names].map(async n => {
      try { return [n, await (await fetch('api/mailbox?tunnel=' + encodeURIComponent(n))).json()]; }
      catch { return [n, []]; }
    }));

    const rows = groups.flatMap(([n, list]) => (list || []).map(p => ({...p, tunnel: n})));
    if (!rows.length){ el.innerHTML = '<p class="empty">nothing stored</p>'; return; }

    el.innerHTML = rows.slice(0, 12).map(p => {
      const done = !!p.deliveredAt;
      return `<div class="mail">
        <span class="badge ${done ? 'done' : 'held'}">${done ? 'sent' : 'held'}</span>
        <span class="who"><b>${esc(p.method)} ${esc(p.path)}</b>
          <small>${esc(p.tunnel)} · ${p.bodySize}B</small></span>
        <button class="rp" onclick="replay(${p.id}, this)">replay</button>
      </div>`;
    }).join('');
  } catch { el.innerHTML = '<p class="empty">nothing stored</p>'; }
}

async function replay(id, btn){
  btn.disabled = true; btn.textContent = '...';
  try {
    const res = await fetch('api/replay/' + id, {method:'POST'});
    const body = await res.json();
    btn.textContent = res.ok ? String(body.status ?? 'ok') : 'failed';
    if (!res.ok) btn.title = body.error || '';
  } catch { btn.textContent = 'failed'; }
  setTimeout(() => { btn.disabled = false; btn.textContent = 'replay'; }, 2200);
}

async function loadTunnels(){
  try {
    const list = await (await fetch('api/tunnels')).json();
    const el = document.getElementById('tunnels');
    if (!list.length){ el.innerHTML = '<p class="empty">none open</p>'; return; }
    el.innerHTML = list.map(t =>
      `<div class="tun"><b>${esc(t.url)}</b>` +
      `<small>→ localhost:${t.localPort} · ${t.requests} req</small></div>`).join('');
  } catch {}
}

function connect(){
  const dot = document.getElementById('dot');
  const status = document.getElementById('status');
  const es = new EventSource('api/stream');

  es.onopen = () => { dot.classList.add('on'); status.textContent = 'live'; };
  es.onerror = () => { dot.classList.remove('on'); status.textContent = 'reconnecting'; };
  es.addEventListener('request', e => { addRow(JSON.parse(e.data), true); loadTunnels(); });
  es.addEventListener('hello', e => {
    const d = JSON.parse(e.data);
    document.getElementById('mode').textContent = '· ' + d.mode;
    (d.recent || []).reverse().forEach(r => addRow(r, false));
  });
}

connect();
loadTunnels();
loadMailbox();
setInterval(() => { loadTunnels(); loadMailbox(); }, 5000);
</script>
